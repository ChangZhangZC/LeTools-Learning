# Feature06 — production BC baseline, NOT a claim of tuned hyperparameters.
# Keep post-rl/config/bc.yaml unchanged as the original 1-step smoke preset.
# State/action/camera shape and names come exclusively from LeRobot v3 metadata.
data:
  repo_id: "local/icra_task1_10bags"
  root: "/root/bayes-tmp/kuavo_dataset/icra_task1_lerobot_jiayi_10bags/lerobot_v3.0"
  video_backend: "pyav"
  n_obs_steps: 2
  horizon: 17             # RL100 no_pre_action=True => 16 modeled action steps
  n_action_steps: 8       # actor's native selected chunk, NOT deployment execution_horizon
policy:
  resize: 224             # RL100 MultiImageObsEncoder preprocessing
  share_rgb_model: false  # original RL100 configuration; separate RGB encoders
  use_group_norm: true
  num_train_timesteps: 100
  num_inference_steps: 10
  down_dims: [256, 512, 1024]
  diffusion_step_embed_dim: 256
  kernel_size: 5
  n_groups: 8
training:
  device: "cuda:0"
  seed: 42
  steps: 100000           # illustrative budget; set for final dataset and GPU
  batch_size: 8
  num_workers: 4
  lr: 0.0001
  weight_decay: 0.000001
  lr_scheduler: "cosine"
  lr_warmup_steps: 500
  max_grad_norm: 1.0      # 0 disables clipping
  use_ema: true
  ema_power: 0.75
  resume: false           # change to true, keep output.dir, to restore latest.pt
  log_every: 50
  val_every: 1000
  save_every: 1000
  keep_step_checkpoints: false
validation:
  fraction: 0.2           # deterministic held-out EPISODES; never random frames
  split_seed: 42
  seed: 1234              # same diffusion noise every validation for comparability
  batch_size: 8
  max_batches: 0          # 0=all eligible val windows (no padding)
output:
  dir: "post_traing/outputs/rl100_bc_production"
