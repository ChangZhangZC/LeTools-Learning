# LeTools native RL100 DP-2D BC baseline; not a claim of tuned hyperparameters.
# BC baseline configuration; historical Smoke Test presets are retired.
# State/action/camera shape and names come exclusively from LeRobot v3 metadata.
data:
  repo_id: "local/icra_task1_full"
  root: "/home/kuavo/changzhang/kdc_ARBiM/data/icra_task1_lerobot/lerobot"
  video_backend: "pyav"
  n_obs_steps: 2
  horizon: 33             # RL100 no_pre_action=True => 32 modeled action steps
  n_action_steps: 16      # first half of the 32-step prediction; NOT deployment execution_horizon
policy:
  resize: 224             # RL100 MultiImageObsEncoder preprocessing
  # Random Crop disabled in build_policy(): crop_shape=None, random_crop=False
  share_rgb_model: false  # original RL100 configuration; separate RGB encoders
  use_group_norm: true
  num_train_timesteps: 100
  num_inference_steps: 10
  down_dims: [256, 512, 1024]
  diffusion_step_embed_dim: 256
  kernel_size: 5
  n_groups: 8
training:
  device: "cuda:0"
  seed: 42
  steps: 100000           # illustrative budget; set for final dataset and GPU
  batch_size: 8
  num_workers: 4
  lr: 0.0001
  weight_decay: 0.000001
  lr_scheduler: "cosine"
  lr_warmup_steps: 500
  max_grad_norm: 1.0      # 0 disables clipping
  use_ema: true
  ema_power: 0.75
  resume: false           # change to true, keep output.dir, to restore latest.pt
  log_every: 50
  val_every: 1000
  save_every: 1000
  keep_step_checkpoints: false
validation:
  fraction: 0.2           # deterministic held-out EPISODES; never random frames
  split_seed: 42
  seed: 1234              # same diffusion noise every validation for comparability
  batch_size: 8
  max_batches: 0          # 0=all eligible val windows (no padding)
# Match kuavo_model/train.py: outputs/train/act_YYYYMMDD_HHMMSS and
# outputs/train/diffusion_YYYYMMDD_HHMMSS. Timestamp is added by the
# production CLI on fresh runs; resume must use the exact existing run path.
wandb:
  enable: false          # ACT defaults true, LeTools diffusion defaults false
  project: "lerobot_rl100_dp_2d"
  entity: null
  mode: "online"         # "online" or "offline"; needs wandb installed if enabled
tensorboard:
  enable: false          # optional; needs tensorboard installed if enabled
output:
  dir: "outputs/train/rl100_dp_2d"
